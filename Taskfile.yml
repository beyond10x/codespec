version: '3'

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: '0'

vars:
  ADAPTERS: '{{.ROOT_DIR}}/target/adapters'
  CODESPEC: '{{.ROOT_DIR}}/target/debug/codespec'

tasks:
  default:
    cmds: [{task: check}]

  check:
    desc: The gate. Format, lint, test, schema drift, adapters, examples, harness.
    cmds:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - cargo test --workspace --locked
      - task: adapters-check
      - task: examples-check
      - task: examples-pass
      - task: examples-go
      - task: examples-rust
      - task: harness

  build:
    desc: Build the codespec CLI and every adapter into target/.
    cmds:
      - cargo build --locked -p b10x-codespec-cli
      - task: adapters

  adapters:
    desc: Build every adapter program into target/adapters.
    cmds:
      - mkdir -p {{.ADAPTERS}}
      - cd adapters/go && go build -o {{.ADAPTERS}}/ ./cmd/...
      - cargo build --locked -p codespec-write-rust
      - cp target/debug/codespec-write-rust {{.ADAPTERS}}/

  adapters-check:
    desc: Format and vet every adapter in its own language.
    cmds:
      - test -z "$(cd adapters/go && gofmt -l .)"
      - cd adapters/go && go vet ./...

  schema:
    desc: Regenerate schemas/cir-1.schema.json from the model.
    cmds:
      - cargo run --locked -q -p b10x-codespec-cli -- schema > schemas/cir-1.schema.json

  examples:
    desc: Re-read every example's source into its checked-in cir/1 document and rewrite its checked-in Go and Rust output.
    deps: [build]
    cmds:
      - '{{.CODESPEC}} read --lang go examples/orders/source --out examples/orders/orders.read.cir.json --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} pass examples/orders/orders.read.cir.json --out examples/orders/orders.cir.json'
      - '{{.CODESPEC}} write --lang go examples/orders/orders.read.cir.json --out examples/orders/out/go --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} write --lang rust examples/orders/orders.cir.json --out examples/orders/out/rust --adapters {{.ADAPTERS}}'

  examples-go:
    desc: Write the orders example as Go, before and after the passes, require it gofmt-clean, vetted, equal to the checked-in copy, and a fixed point of the reader.
    deps: [build]
    cmds:
      - rm -rf target/examples-go target/examples-go-pass
      - mkdir -p target/examples-go target/examples-go-pass
      - '{{.CODESPEC}} write --lang go examples/orders/orders.read.cir.json --out target/examples-go --adapters {{.ADAPTERS}}'
      - diff -r target/examples-go examples/orders/out/go
      - cmp target/examples-go/orders.go examples/orders/out/go/orders.go
      - test -z "$(gofmt -l target/examples-go)"
      - go vet ./target/examples-go/orders.go
      - '{{.CODESPEC}} write --lang go examples/orders/orders.cir.json --out target/examples-go-pass --adapters {{.ADAPTERS}}'
      - diff -r target/examples-go-pass examples/orders/out/go
      - test -z "$(gofmt -l target/examples-go-pass)"
      - go vet ./target/examples-go-pass/orders.go
      - cd adapters/go && go test -count=1 ./cmd/codespec-write-go

  examples-rust:
    desc: Write the orders example as Rust, require it equal to the checked-in copy, Audit its one refusal, a build without warnings, and a module without facts refused.
    deps: [build]
    cmds:
      - rm -rf target/examples-rust
      - '{{.CODESPEC}} write --lang rust examples/orders/orders.cir.json --out target/examples-rust/orders --adapters {{.ADAPTERS}}'
      - diff -r target/examples-rust/orders examples/orders/out/rust
      - cmp target/examples-rust/orders/src/lib.rs examples/orders/out/rust/src/lib.rs
      - cmp target/examples-rust/orders/refusals.json examples/orders/out/rust/refusals.json
      - 'test "$(grep -c ''"name":'' target/examples-rust/orders/refusals.json)" = 1'
      - 'grep -q ''"name": "Service.Audit"'' target/examples-rust/orders/refusals.json'
      - 'grep -q ''"pos": "orders.go:132"'' target/examples-rust/orders/refusals.json'
      - RUSTFLAGS='-D warnings' cargo build --manifest-path target/examples-rust/orders/Cargo.toml --target-dir target/examples-rust/build
      - '! {{.CODESPEC}} write --lang rust examples/orders/orders.read.cir.json --out target/examples-rust/no-facts --adapters {{.ADAPTERS}}'
      - test ! -e target/examples-rust/no-facts

  harness:
    desc: Run the original, the Go output and the Rust output of orders on 200 seeded traces of 300 commands and require byte-equal output.
    deps: [build]
    cmds:
      - test -z "$(gofmt -l examples/orders/drivers/go)"
      - cargo fmt --manifest-path examples/orders/drivers/rust/Cargo.toml --check
      - cargo clippy --manifest-path examples/orders/drivers/rust/Cargo.toml --locked --target-dir target/harness/rust-target -- -D warnings
      - '{{.CODESPEC}} harness examples/orders --seeds 200 --commands 300 --build-dir target/harness'

  examples-pass:
    desc: Fail when the passes over an example give bytes other than its checked-in document, or change their own output.
    deps: [build]
    cmds:
      - mkdir -p target/examples-pass
      - '{{.CODESPEC}} pass examples/orders/orders.read.cir.json --out target/examples-pass/orders.1.json'
      - '{{.CODESPEC}} pass target/examples-pass/orders.1.json --out target/examples-pass/orders.2.json'
      - cmp target/examples-pass/orders.1.json examples/orders/orders.cir.json
      - cmp target/examples-pass/orders.1.json target/examples-pass/orders.2.json
      - '{{.CODESPEC}} validate --canonical examples/orders/orders.cir.json'

  examples-check:
    desc: Fail when reading an example twice gives different bytes, or bytes other than the checked-in document.
    deps: [build]
    cmds:
      - mkdir -p target/examples-check
      - '{{.CODESPEC}} read --lang go examples/orders/source --out target/examples-check/orders.1.json --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} read --lang go examples/orders/source --out target/examples-check/orders.2.json --adapters {{.ADAPTERS}}'
      - cmp target/examples-check/orders.1.json target/examples-check/orders.2.json
      - cmp target/examples-check/orders.1.json examples/orders/orders.read.cir.json
      - '{{.CODESPEC}} validate --canonical examples/orders/orders.read.cir.json'
