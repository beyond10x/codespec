version: '3'

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: '0'

vars:
  ADAPTERS: '{{.ROOT_DIR}}/target/adapters'
  CODESPEC: '{{.ROOT_DIR}}/target/debug/codespec'
  JDK: '{{.JDK | default "/usr/lib/jvm/java-21-openjdk"}}'
  MVN_FLAGS: '{{.MVN_FLAGS | default "-o -q"}}'
  GROOVY_JAR:
    sh: echo "${GROOVY_HOME:-$HOME/.sdkman/candidates/groovy/2.4.10}/embeddable/groovy-all-2.4.10.jar"

tasks:
  default:
    cmds: [{task: check}]

  check:
    desc: The gate. Format, lint, test, schema drift, adapters, examples, harness, generated docs.
    cmds:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - cargo test --workspace --locked
      - task: adapters-check
      - task: examples-check
      - task: examples-pass
      - task: examples-go
      - task: examples-rust
      - task: examples-greeter
      - task: examples-inventory
      - task: examples-effects
      - task: examples-series
      - task: examples-ledger
      - task: examples-fees
      - task: harness
      - task: conformance-cases
      - task: conformance-kit
      - task: groovy-fixture-check
      - task: docs-check

  docs-generate:
    desc: Regenerate the generated documentation pages, the showcase, the cir/1 diagram, the reader corpora (conformance/reader) from the kit's case sources, the conformance reports of every adapter (website/data/conformance), the support matrix and website/data/status.json.
    deps: [build]
    cmds:
      - cargo run --locked -q -p codespec-docs -- generate

  docs-check:
    desc: Fail when a generated documentation file is missing, stale or hand-edited, a reader corpus differs from the kit's case sources, a conformance report differs from codespec conform run again on the Go, Rust, Java and Groovy readers and the Go, Rust and C writers, the support matrix differs from its manifests and reports, or a page has a raw admonition title.
    deps: [build]
    cmds:
      - cargo run --locked -q -p codespec-docs -- generate --check

  docs-site:
    desc: Build the documentation site into website/build (Node; not part of the gate).
    cmds:
      - npm --prefix website ci --allow-git=root
      - npm --prefix website run build

  ux-install:
    desc: Install the UX harness in ux/ (Playwright, axe-core, TypeScript) and its Chromium. Needs the network; every ux task after it does not.
    dir: ux
    method: timestamp
    sources: [package.json, package-lock.json]
    generates: [node_modules/.package-lock.json]
    cmds:
      - npm ci --no-audit --no-fund
      - npx playwright install chromium

  ux-site:
    desc: Build website/build for the UX harness when it is missing or older than the site's sources. Needs website/node_modules (task docs-site once).
    method: timestamp
    sources:
      - website/docs/**/*
      - website/src/**/*
      - website/static/**/*
      - website/data/**/*
      - website/docusaurus.config.ts
      - website/sidebars.ts
      - website/product.json
      - website/package-lock.json
    generates: [website/build/sitemap.xml]
    preconditions:
      - sh: test -d website/node_modules
        msg: website/node_modules is missing; run `task docs-site` once
    cmds:
      - npm --prefix website run build

  ux-check:
    desc: The every-merge UX gate (ui-iteration-loop L1–L3) on website/build served locally, no network. Typecheck, the findings rule, L1 core and break-tests, L2 layout contract (gates 1, 2, 5), L3 screen-only user (gate 4), then the ratchet against ux/baseline.json and main's. Not part of task check.
    deps: [ux-install, ux-site]
    dir: ux
    cmds:
      - npx tsc --noEmit
      - node cli.ts findings
      - npx playwright test
      - node cli.ts ratchet

  ux-ratchet:
    desc: The ratchet alone over the last ux-check results. `task ux-ratchet -- --update [--decision <id>]` takes the measured values into ux/baseline.json in the same merge.
    dir: ux
    cmds:
      - node cli.ts ratchet {{.CLI_ARGS}}

  ux-scenarios:
    desc: Add a page scenario under ux/scenarios for every page in website/build/sitemap.xml that has none; report stale ones.
    deps: [ux-site]
    dir: ux
    cmds:
      - node cli.ts scenarios

  ux-round:
    desc: The Measure step of a UX round. Runs L2 at the gating and measured-only viewports and L3, takes contact sheets, and writes ux/rounds/R-nn/{report.md,round.json,shots/} and ux/rounds/trend.md. `task ux-round -- --round R-nn` re-measures a given round.
    deps: [ux-install, ux-site]
    dir: ux
    cmds:
      - node cli.ts round {{.CLI_ARGS}}

  build:
    desc: Build the codespec CLI and every adapter into target/.
    cmds:
      - cargo build --locked -p b10x-codespec-cli
      - task: adapters

  adapters:
    desc: Build every adapter program and runner, the JVM runners codespec-run-java and codespec-run-groovy among them, into target/adapters.
    cmds:
      - mkdir -p {{.ADAPTERS}}
      - cd adapters/go && go build -o {{.ADAPTERS}}/ ./cmd/...
      - cargo build --locked -p codespec-write-rust -p codespec-read-rust -p codespec-run-rust -p codespec-write-c -p codespec-run-c -p codespec-read-c
      - cp target/debug/codespec-write-rust target/debug/codespec-read-rust target/debug/codespec-run-rust target/debug/codespec-write-c target/debug/codespec-run-c target/debug/codespec-read-c {{.ADAPTERS}}/
      - rm -rf target/java/classes
      - mkdir -p target/java/classes
      - '{{.JDK}}/bin/javac --release 17 -Xlint:all -Werror -d target/java/classes $(find adapters/java/src adapters/jvm/src -name "*.java" | sort)'
      - printf '#!/bin/sh\nexec %s -XX:-UsePerfData -cp %s codespec.read.Main "$@"\n' '{{.JDK}}/bin/java' '{{.ROOT_DIR}}/target/java/classes' > {{.ADAPTERS}}/codespec-read-java
      - chmod +x {{.ADAPTERS}}/codespec-read-java
      - printf '#!/bin/sh\nexec %s -XX:-UsePerfData -cp %s codespec.run.java.Main "$@"\n' '{{.JDK}}/bin/java' '{{.ROOT_DIR}}/target/java/classes' > {{.ADAPTERS}}/codespec-run-java
      - chmod +x {{.ADAPTERS}}/codespec-run-java
      - rm -rf target/groovy/classes
      - mkdir -p target/groovy/classes
      - '{{.JDK}}/bin/javac --release 17 -Xlint:all -Werror -cp {{.GROOVY_JAR}} -d target/groovy/classes $(find adapters/groovy/src adapters/jvm/src -name "*.java" | sort)'
      - printf '#!/bin/sh\nexec %s -XX:-UsePerfData -cp %s:%s codespec.read.groovy.Main "$@"\n' '{{.JDK}}/bin/java' '{{.ROOT_DIR}}/target/groovy/classes' '{{.GROOVY_JAR}}' > {{.ADAPTERS}}/codespec-read-groovy
      - chmod +x {{.ADAPTERS}}/codespec-read-groovy
      - printf '#!/bin/sh\nexec %s -XX:-UsePerfData -cp %s:%s codespec.run.groovy.Main "$@"\n' '{{.JDK}}/bin/java' '{{.ROOT_DIR}}/target/groovy/classes' '{{.GROOVY_JAR}}' > {{.ADAPTERS}}/codespec-run-groovy
      - chmod +x {{.ADAPTERS}}/codespec-run-groovy

  adapters-check:
    desc: Format, vet and test every adapter in its own language (the Groovy reader's Grails-jar cases run when GRAILS_HOME names a Grails 2.5.6 distribution); read the Java ledger, the Groovy typed package and the Grails lending application twice each through codespec read, byte-equal and canonical, the lending read equal to adapters/groovy/testdata/lending.read.cir.json and codespec measure over it, run twice, equal to adapters/groovy/testdata/lending.measure.txt; read the Quarkus fixture adapters/java/testdata/quarkus as a project against its Maven class path (task java-quarkus-check); run every kit case's java/Case.java through the Java reader, the passes, the Go writer and codespec-run-go against its expected.txt, its module using its subject; read every adapter's --describe manifest strictly, the Java reader's claim covered by its ledger and kit outputs and the Groovy reader's by its typed output and its reads of the Groovy corpus conformance/reader/groovy; read the Java nullable fixture with no refusal, pass it, write it as Go and as Rust with no refusal, and run both and the Java original on its calls.json, byte-equal.
    deps: [build]
    cmds:
      - test -z "$(cd adapters/go && gofmt -l .)"
      - cd adapters/go && go vet ./...
      - rm -rf target/java/test-classes target/java/test-work target/java-check
      - mkdir -p target/java/test-classes target/java-check
      - '{{.JDK}}/bin/javac --release 17 -Xlint:all -Werror -d target/java/test-classes $(find adapters/java/src adapters/java/test adapters/jvm/src adapters/jvm/test -name "*.java" | sort)'
      - '{{.JDK}}/bin/java -cp target/java/test-classes codespec.jvm.JvmTypesTest'
      - task: java-quarkus-prepare
      - 'CODESPEC_JAVA_CLASSPATH="$(cat target/java-classpath.txt)" {{.JDK}}/bin/java -cp target/java/test-classes codespec.read.ReaderTest {{.ROOT_DIR}} {{.CODESPEC}} target/java/test-work {{.ADAPTERS}}'
      - '{{.CODESPEC}} read --lang java adapters/java/testdata/ledger --out target/java-check/ledger.1.json --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} read --lang java adapters/java/testdata/ledger --out target/java-check/ledger.2.json --adapters {{.ADAPTERS}}'
      - cmp target/java-check/ledger.1.json target/java-check/ledger.2.json
      - '{{.CODESPEC}} validate --canonical target/java-check/ledger.1.json'
      - '! grep -q ''"refusals"'' target/java-check/ledger.1.json'
      - task: java-quarkus-check
      - rm -rf target/groovy/test-classes target/groovy/test-work target/groovy-check
      - mkdir -p target/groovy/test-classes target/groovy-check
      - '{{.JDK}}/bin/javac --release 17 -Xlint:all -Werror -cp {{.GROOVY_JAR}} -d target/groovy/test-classes $(find adapters/groovy/src adapters/groovy/test adapters/jvm/src adapters/jvm/test -name "*.java" | sort)'
      - '{{.JDK}}/bin/java -cp target/groovy/test-classes codespec.read.groovy.JsonTest'
      - '{{.JDK}}/bin/java -cp target/groovy/test-classes:{{.GROOVY_JAR}} codespec.read.groovy.ReaderTest {{.ROOT_DIR}} {{.CODESPEC}} target/groovy/test-work'
      - '{{.CODESPEC}} read --lang groovy adapters/groovy/testdata/typed --out target/groovy-check/typed.1.json --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} read --lang groovy adapters/groovy/testdata/typed --out target/groovy-check/typed.2.json --adapters {{.ADAPTERS}}'
      - cmp target/groovy-check/typed.1.json target/groovy-check/typed.2.json
      - '{{.CODESPEC}} validate --canonical target/groovy-check/typed.1.json'
      - '! grep -q ''"refusals"'' target/groovy-check/typed.1.json'
      - 'env -u CODESPEC_GROOVY_CLASSPATH {{.CODESPEC}} read --lang groovy adapters/groovy/testdata/lending --out target/groovy-check/lending.1.json --adapters {{.ADAPTERS}}'
      - 'env -u CODESPEC_GROOVY_CLASSPATH {{.CODESPEC}} read --lang groovy adapters/groovy/testdata/lending --out target/groovy-check/lending.2.json --adapters {{.ADAPTERS}}'
      - cmp target/groovy-check/lending.1.json target/groovy-check/lending.2.json
      - '{{.CODESPEC}} validate --canonical target/groovy-check/lending.1.json'
      - cmp target/groovy-check/lending.1.json adapters/groovy/testdata/lending.read.cir.json
      - '{{.CODESPEC}} measure target/groovy-check/lending.1.json > target/groovy-check/lending.measure.1.txt'
      - '{{.CODESPEC}} measure target/groovy-check/lending.1.json > target/groovy-check/lending.measure.2.txt'
      - cmp target/groovy-check/lending.measure.1.txt target/groovy-check/lending.measure.2.txt
      - cmp target/groovy-check/lending.measure.1.txt adapters/groovy/testdata/lending.measure.txt
      - rm -rf target/manifests
      - mkdir -p target/manifests
      - for a in codespec-read-go codespec-write-go codespec-read-rust codespec-write-rust codespec-read-java codespec-read-groovy codespec-write-c codespec-read-c; do {{.ADAPTERS}}/$a --describe > target/manifests/$a.json || exit 1; done
      - for a in codespec-read-go codespec-write-go codespec-read-rust codespec-write-rust codespec-write-c codespec-read-c; do cargo run --locked -q -p b10x-codespec-conformance -- manifest target/manifests/$a.json > /dev/null || exit 1; done
      - 'for d in target/java/test-work/kit/*/; do cargo run --locked -q -p b10x-codespec-conformance -- features "$d/read.cir.json" | grep -qxF "$(cat "$d/subject")" || { echo "$d does not use its subject $(cat "$d/subject")"; exit 1; }; done'
      - 'cargo run --locked -q -p b10x-codespec-conformance -- manifest target/manifests/codespec-read-java.json --read examples/ledger/ledger.read.cir.json $(for m in target/java/test-work/kit/*/read.cir.json; do echo --read "$m"; done) > /dev/null'
      - rm -rf target/groovy-check/kit && mkdir -p target/groovy-check/kit
      - 'for d in conformance/reader/groovy/*/; do {{.CODESPEC}} read --lang groovy "$d" --out "target/groovy-check/kit/$(basename "$d").json" --adapters {{.ADAPTERS}} 2>/dev/null || true; done'
      - 'cargo run --locked -q -p b10x-codespec-conformance -- manifest target/manifests/codespec-read-groovy.json --read target/groovy-check/typed.1.json $(for m in target/groovy-check/kit/*.json; do echo --read "$m"; done) > /dev/null'
      - rm -rf target/nullable
      - mkdir -p target/nullable/java
      - '{{.CODESPEC}} read --lang java adapters/java/testdata/nullable --out target/nullable/read.json --adapters {{.ADAPTERS}}'
      - '! grep -q ''"refusals"'' target/nullable/read.json'
      - '{{.CODESPEC}} pass target/nullable/read.json --out target/nullable/pass.json'
      - '{{.CODESPEC}} write --lang go target/nullable/pass.json --out target/nullable/go --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} write --lang rust target/nullable/pass.json --out target/nullable/rust --adapters {{.ADAPTERS}}'
      - 'test "$(cat target/nullable/rust/refusals.json)" = "[]"'
      - '{{.ADAPTERS}}/codespec-run-go -build target/nullable/go-build target/nullable/go adapters/java/testdata/nullable/calls.json > target/nullable/go.txt'
      - '{{.ADAPTERS}}/codespec-run-rust --build target/nullable/rust-build target/nullable/rust adapters/java/testdata/nullable/calls.json > target/nullable/rust.txt'
      - '{{.JDK}}/bin/javac --release 17 -Xlint:all -Werror -d target/nullable/java adapters/java/testdata/nullable/*.java adapters/java/testdata/nullable/driver/Main.java'
      - '{{.JDK}}/bin/java -cp target/nullable/java Main adapters/java/testdata/nullable/calls.json > target/nullable/java.txt'
      - cmp target/nullable/go.txt target/nullable/java.txt
      - cmp target/nullable/rust.txt target/nullable/java.txt

  java-classpath:
    desc: Write the dependency class path of the Maven project in PROJECT, or in the directory after --, to target/java-classpath.txt, the value of CODESPEC_JAVA_CLASSPATH. Maven runs with MVN_FLAGS, offline by default (-o -q), and the reader never runs it.
    vars:
      PROJECT: '{{.PROJECT | default .CLI_ARGS}}'
    cmds:
      - mkdir -p target
      - 'JAVA_HOME={{.JDK}} mvn {{.MVN_FLAGS}} -f {{.PROJECT}}/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.7.0:build-classpath -Dmdep.outputFile={{.ROOT_DIR}}/target/java-classpath.txt'

  java-quarkus-prepare:
    desc: Build the Quarkus fixture adapters/java/testdata/quarkus with mvn package under MVN_FLAGS (offline by default, -B -q online in CI) and write its class path to target/java-classpath.txt.
    cmds:
      - 'JAVA_HOME={{.JDK}} mvn {{.MVN_FLAGS}} -f adapters/java/testdata/quarkus/pom.xml package'
      - task: java-classpath
        vars: {PROJECT: adapters/java/testdata/quarkus}

  c-round-trip:
    desc: Write every kit case's case.cir.json, passed, as C with codespec-write-c into target/c-round-trip, read each output with codespec-read-c, and print how many read with no refusal and no foreign statement, how many with one, and how many the writer or reader left without a module.
    deps: [build]
    cmds:
      - rm -rf target/c-round-trip
      - mkdir -p target/c-round-trip
      - |
        clean=0; refused=0; none=0
        for d in conformance/cases/*/; do
          c=$(basename "$d"); w=target/c-round-trip/$c
          mkdir -p "$w/c"
          if ! {{.CODESPEC}} pass --out "$w/passed.json" "$d/case.cir.json" > "$w/log" 2>&1 \
            || ! {{.CODESPEC}} write --lang c --adapters {{.ADAPTERS}} --out "$w/c" "$w/passed.json" >> "$w/log" 2>&1 \
            || ! {{.ADAPTERS}}/codespec-read-c "$w/c" > "$w/read.json" 2>> "$w/log"; then
            none=$((none+1)); continue
          fi
          n=$(jq '(.refusals | length) + ([.. | objects | select(.k? == "foreign")] | length)' "$w/read.json")
          if [ "$n" = 0 ]; then clean=$((clean+1)); else refused=$((refused+1)); fi
        done
        echo "c round trip: $clean read with no refusal, $refused with a refusal, $none without a module"

  java-quarkus-check:
    desc: Read the Quarkus fixture as a project against its class path twice through codespec read, byte-equal, canonical and equal to adapters/java/testdata/quarkus.read.cir.json, then run codespec effects over it with the summary codespec-read-java --effects prints. Needs task java-quarkus-prepare first.
    cmds:
      - rm -rf target/java-quarkus
      - mkdir -p target/java-quarkus
      - 'CODESPEC_JAVA_CLASSPATH="$(cat target/java-classpath.txt)" {{.CODESPEC}} read --lang java adapters/java/testdata/quarkus --out target/java-quarkus/read.1.json --adapters {{.ADAPTERS}}'
      - 'CODESPEC_JAVA_CLASSPATH="$(cat target/java-classpath.txt)" {{.CODESPEC}} read --lang java adapters/java/testdata/quarkus --out target/java-quarkus/read.2.json --adapters {{.ADAPTERS}}'
      - cmp target/java-quarkus/read.1.json target/java-quarkus/read.2.json
      - '{{.CODESPEC}} validate --canonical target/java-quarkus/read.1.json'
      - cmp target/java-quarkus/read.1.json adapters/java/testdata/quarkus.read.cir.json
      - 'CODESPEC_JAVA_CLASSPATH="$(cat target/java-classpath.txt)" {{.ADAPTERS}}/codespec-read-java --effects adapters/java/testdata/quarkus > target/java-quarkus/effects.summary.json'
      - '{{.CODESPEC}} effects target/java-quarkus/read.1.json --summaries target/java-quarkus/effects.summary.json > target/java-quarkus/effects.1.json'
      - '{{.CODESPEC}} effects target/java-quarkus/read.1.json --summaries target/java-quarkus/effects.summary.json > target/java-quarkus/effects.2.json'
      - cmp target/java-quarkus/effects.1.json target/java-quarkus/effects.2.json

  java-quickstart:
    desc: Read the pinned Quarkus quickstart application hibernate-orm-panache-quickstart as a project against the class path of adapters/java/testdata/quickstart and print its numbers. QUICKSTARTS names a clone of github.com/quarkusio/quarkus-quickstarts at the pinned commit. Not in the gate, it needs the clone.
    requires:
      vars: [QUICKSTARTS]
    vars:
      QUICKSTART_COMMIT: 81a58443e92d0080c962f4ef01aa9e6118deb7a5
      QUICKSTART_APP: hibernate-orm-panache-quickstart
    cmds:
      - 'test "$(git -C {{.QUICKSTARTS}} rev-parse HEAD)" = {{.QUICKSTART_COMMIT}}'
      - task: java-classpath
        vars: {PROJECT: adapters/java/testdata/quickstart}
      - rm -rf target/java-quickstart
      - mkdir -p target/java-quickstart
      - 'CODESPEC_JAVA_CLASSPATH="$(cat target/java-classpath.txt)" {{.ADAPTERS}}/codespec-read-java --all {{.QUICKSTARTS}}/{{.QUICKSTART_APP}} target/java-quickstart'
      - 'for f in target/java-quickstart/*.cir.json; do {{.CODESPEC}} validate --canonical "$f" > /dev/null || exit 1; done'
      - sh adapters/java/read-numbers.sh target/java-quickstart

  groovy-fixture-check:
    desc: Compile the Grails lending fixture's domain classes, services and utils with groovyc 2.4.10 on the JDK, all but TransactionalAuditService.groovy, which needs the Grails jars. GROOVY_HOME defaults to the sdkman groovy/2.4.10 candidate.
    cmds:
      - rm -rf target/groovy-fixture
      - mkdir -p target/groovy-fixture
      - 'GROOVY_HOME="${GROOVY_HOME:-$HOME/.sdkman/candidates/groovy/2.4.10}"; JAVA_HOME="{{.JDK}}" "$GROOVY_HOME/bin/groovyc" -v 2>&1 | grep -q "Groovy compiler version 2.4.10"'
      - 'GROOVY_HOME="${GROOVY_HOME:-$HOME/.sdkman/candidates/groovy/2.4.10}"; JAVA_HOME="{{.JDK}}" "$GROOVY_HOME/bin/groovyc" -d target/groovy-fixture $(find adapters/groovy/testdata/lending/grails-app/domain adapters/groovy/testdata/lending/grails-app/services adapters/groovy/testdata/lending/grails-app/utils -name "*.groovy" ! -name TransactionalAuditService.groovy | sort)'

  schema:
    desc: Regenerate schemas/cir-1.schema.json and schemas/cir-1.features.json from the model.
    cmds:
      - cargo run --locked -q -p b10x-codespec-cli -- schema > schemas/cir-1.schema.json
      - cargo run --locked -q -p b10x-codespec-cli -- features > schemas/cir-1.features.json

  examples:
    desc: Re-read every example's source into its checked-in cir/1 document and rewrite its checked-in Go and Rust output; read the series Rust output back and rewrite its Go.
    deps: [build]
    cmds:
      - '{{.CODESPEC}} read --lang go examples/orders/source --out examples/orders/orders.read.cir.json --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} pass examples/orders/orders.read.cir.json --out examples/orders/orders.cir.json'
      - '{{.CODESPEC}} write --lang go examples/orders/orders.read.cir.json --out examples/orders/out/go --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} write --lang rust examples/orders/orders.cir.json --out examples/orders/out/rust --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} read --lang go examples/greeter/source --out examples/greeter/greeter.read.cir.json --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} pass examples/greeter/greeter.read.cir.json --out examples/greeter/greeter.cir.json'
      - '{{.CODESPEC}} write --lang go examples/greeter/greeter.read.cir.json --out examples/greeter/out/go --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} write --lang rust examples/greeter/greeter.cir.json --out examples/greeter/out/rust --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} read --lang rust examples/inventory/source --out examples/inventory/inventory.read.cir.json --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} pass examples/inventory/inventory.read.cir.json --out examples/inventory/inventory.cir.json'
      - '{{.CODESPEC}} write --lang go examples/inventory/inventory.cir.json --out examples/inventory/out/go --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} write --lang rust examples/inventory/inventory.cir.json --out examples/inventory/out/rust --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} read --lang go examples/series/source --out examples/series/series.read.cir.json --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} pass examples/series/series.read.cir.json --out examples/series/series.cir.json'
      - '{{.CODESPEC}} write --lang go examples/series/series.read.cir.json --out examples/series/out/go --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} write --lang rust examples/series/series.cir.json --out examples/series/out/rust --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} read --lang rust examples/series/out/rust --out examples/series/series.rust-read.cir.json --adapters {{.ADAPTERS}}'
      - mkdir -p target/examples
      - '{{.CODESPEC}} pass examples/series/series.rust-read.cir.json --out target/examples/series.rust-passed.cir.json'
