version: '3'

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: '0'

vars:
  ADAPTERS: '{{.ROOT_DIR}}/target/adapters'
  CODESPEC: '{{.ROOT_DIR}}/target/debug/codespec'

tasks:
  default:
    cmds: [{task: check}]

  check:
    desc: The gate. Format, lint, test, schema drift, adapters, examples, harness, generated docs.
    cmds:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - cargo test --workspace --locked
      - task: adapters-check
      - task: examples-check
      - task: examples-pass
      - task: examples-go
      - task: examples-rust
      - task: examples-greeter
      - task: examples-inventory
      - task: examples-series
      - task: harness
      - task: docs-check

  docs-generate:
    desc: Regenerate the generated documentation pages, the showcase, the cir/1 diagram and website/data/status.json.
    cmds:
      - cargo run --locked -q -p codespec-docs -- generate

  docs-check:
    desc: Fail when a generated documentation file is missing, stale or hand-edited, or a page has a raw admonition title.
    cmds:
      - cargo run --locked -q -p codespec-docs -- generate --check

  docs-site:
    desc: Build the documentation site into website/build (Node; not part of the gate).
    cmds:
      - npm --prefix website ci --allow-git=root
      - npm --prefix website run build

  build:
    desc: Build the codespec CLI and every adapter into target/.
    cmds:
      - cargo build --locked -p b10x-codespec-cli
      - task: adapters

  adapters:
    desc: Build every adapter program into target/adapters.
    cmds:
      - mkdir -p {{.ADAPTERS}}
      - cd adapters/go && go build -o {{.ADAPTERS}}/ ./cmd/...
      - cargo build --locked -p codespec-write-rust -p codespec-read-rust
      - cp target/debug/codespec-write-rust target/debug/codespec-read-rust {{.ADAPTERS}}/

  adapters-check:
    desc: Format and vet every adapter in its own language.
    cmds:
      - test -z "$(cd adapters/go && gofmt -l .)"
      - cd adapters/go && go vet ./...

  schema:
    desc: Regenerate schemas/cir-1.schema.json from the model.
    cmds:
      - cargo run --locked -q -p b10x-codespec-cli -- schema > schemas/cir-1.schema.json

  examples:
    desc: Re-read every example's source into its checked-in cir/1 document and rewrite its checked-in Go and Rust output.
    deps: [build]
    cmds:
      - '{{.CODESPEC}} read --lang go examples/orders/source --out examples/orders/orders.read.cir.json --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} pass examples/orders/orders.read.cir.json --out examples/orders/orders.cir.json'
      - '{{.CODESPEC}} write --lang go examples/orders/orders.read.cir.json --out examples/orders/out/go --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} write --lang rust examples/orders/orders.cir.json --out examples/orders/out/rust --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} read --lang go examples/greeter/source --out examples/greeter/greeter.read.cir.json --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} pass examples/greeter/greeter.read.cir.json --out examples/greeter/greeter.cir.json'
      - '{{.CODESPEC}} write --lang go examples/greeter/greeter.read.cir.json --out examples/greeter/out/go --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} write --lang rust examples/greeter/greeter.cir.json --out examples/greeter/out/rust --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} read --lang rust examples/inventory/source --out examples/inventory/inventory.read.cir.json --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} pass examples/inventory/inventory.read.cir.json --out examples/inventory/inventory.cir.json'
      - '{{.CODESPEC}} write --lang go examples/inventory/inventory.cir.json --out examples/inventory/out/go --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} write --lang rust examples/inventory/inventory.cir.json --out examples/inventory/out/rust --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} read --lang go examples/series/source --out examples/series/series.read.cir.json --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} pass examples/series/series.read.cir.json --out examples/series/series.cir.json'
      - '{{.CODESPEC}} write --lang go examples/series/series.read.cir.json --out examples/series/out/go --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} write --lang rust examples/series/series.cir.json --out examples/series/out/rust --adapters {{.ADAPTERS}}'

  examples-go:
    desc: Write the orders example as Go, before and after the passes, require it gofmt-clean, vetted, equal to the checked-in copy, and a fixed point of the reader.
    deps: [build]
    cmds:
      - rm -rf target/examples-go target/examples-go-pass
      - mkdir -p target/examples-go target/examples-go-pass
      - '{{.CODESPEC}} write --lang go examples/orders/orders.read.cir.json --out target/examples-go --adapters {{.ADAPTERS}}'
      - diff -r target/examples-go examples/orders/out/go
      - cmp target/examples-go/orders.go examples/orders/out/go/orders.go
      - test -z "$(gofmt -l target/examples-go)"
      - go vet ./target/examples-go/orders.go
      - '{{.CODESPEC}} write --lang go examples/orders/orders.cir.json --out target/examples-go-pass --adapters {{.ADAPTERS}}'
      - diff -r target/examples-go-pass examples/orders/out/go
      - test -z "$(gofmt -l target/examples-go-pass)"
      - go vet ./target/examples-go-pass/orders.go
      - cd adapters/go && go test -count=1 ./cmd/codespec-write-go

  examples-rust:
    desc: Write the orders example as Rust, require it equal to the checked-in copy, Audit its one refusal, a build without warnings, and a module without facts refused.
    deps: [build]
    cmds:
      - rm -rf target/examples-rust
      - '{{.CODESPEC}} write --lang rust examples/orders/orders.cir.json --out target/examples-rust/orders --adapters {{.ADAPTERS}}'
      - diff -r target/examples-rust/orders examples/orders/out/rust
      - cmp target/examples-rust/orders/src/lib.rs examples/orders/out/rust/src/lib.rs
      - cmp target/examples-rust/orders/refusals.json examples/orders/out/rust/refusals.json
      - 'test "$(grep -c ''"name":'' target/examples-rust/orders/refusals.json)" = 1'
      - 'grep -q ''"name": "Service.Audit"'' target/examples-rust/orders/refusals.json'
      - 'grep -q ''"pos": "orders.go:132"'' target/examples-rust/orders/refusals.json'
      - RUSTFLAGS='-D warnings' cargo build --manifest-path target/examples-rust/orders/Cargo.toml --target-dir target/examples-rust/build
      - '! {{.CODESPEC}} write --lang rust examples/orders/orders.read.cir.json --out target/examples-rust/no-facts --adapters {{.ADAPTERS}}'
      - test ! -e target/examples-rust/no-facts

  harness:
    desc: Run the original, the Go output and the Rust output of orders on 200 seeded traces of 300 commands and require byte-equal output.
    deps: [build]
    cmds:
      - test -z "$(gofmt -l examples/orders/drivers/go)"
      - cargo fmt --manifest-path examples/orders/drivers/rust/Cargo.toml --check
      - cargo clippy --manifest-path examples/orders/drivers/rust/Cargo.toml --locked --target-dir target/harness/rust-target -- -D warnings
      - '{{.CODESPEC}} harness examples/orders --seeds 200 --commands 300 --build-dir target/harness'

  examples-pass:
    desc: Fail when the passes over an example give bytes other than its checked-in document, or change their own output.
    deps: [build]
    cmds:
      - mkdir -p target/examples-pass
      - '{{.CODESPEC}} pass examples/orders/orders.read.cir.json --out target/examples-pass/orders.1.json'
      - '{{.CODESPEC}} pass target/examples-pass/orders.1.json --out target/examples-pass/orders.2.json'
      - cmp target/examples-pass/orders.1.json examples/orders/orders.cir.json
      - cmp target/examples-pass/orders.1.json target/examples-pass/orders.2.json
      - '{{.CODESPEC}} validate --canonical examples/orders/orders.cir.json'

  examples-check:
    desc: Fail when reading an example twice gives different bytes, or bytes other than the checked-in document.
    deps: [build]
    cmds:
      - mkdir -p target/examples-check
      - '{{.CODESPEC}} read --lang go examples/orders/source --out target/examples-check/orders.1.json --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} read --lang go examples/orders/source --out target/examples-check/orders.2.json --adapters {{.ADAPTERS}}'
      - cmp target/examples-check/orders.1.json target/examples-check/orders.2.json
      - cmp target/examples-check/orders.1.json examples/orders/orders.read.cir.json
      - '{{.CODESPEC}} validate --canonical examples/orders/orders.read.cir.json'
      - '{{.CODESPEC}} read --lang go examples/greeter/source --out target/examples-check/greeter.1.json --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} read --lang go examples/greeter/source --out target/examples-check/greeter.2.json --adapters {{.ADAPTERS}}'
      - cmp target/examples-check/greeter.1.json target/examples-check/greeter.2.json
      - cmp target/examples-check/greeter.1.json examples/greeter/greeter.read.cir.json
      - '{{.CODESPEC}} validate --canonical examples/greeter/greeter.read.cir.json'

  examples-greeter:
    desc: Pass the greeter example, write it as Go and as Rust, require every output equal to the checked-in copy, no refusal, gofmt-clean vetted Go and a Rust build without warnings.
    deps: [build]
    cmds:
      - rm -rf target/examples-greeter
      - mkdir -p target/examples-greeter
      - '{{.CODESPEC}} pass examples/greeter/greeter.read.cir.json --out target/examples-greeter/greeter.1.json'
      - '{{.CODESPEC}} pass target/examples-greeter/greeter.1.json --out target/examples-greeter/greeter.2.json'
      - cmp target/examples-greeter/greeter.1.json examples/greeter/greeter.cir.json
      - cmp target/examples-greeter/greeter.1.json target/examples-greeter/greeter.2.json
      - '{{.CODESPEC}} write --lang go examples/greeter/greeter.read.cir.json --out target/examples-greeter/go --adapters {{.ADAPTERS}}'
      - diff -r target/examples-greeter/go examples/greeter/out/go
      - test -z "$(gofmt -l target/examples-greeter/go)"
      - go vet ./target/examples-greeter/go/greeter.go
      - '{{.CODESPEC}} write --lang rust examples/greeter/greeter.cir.json --out target/examples-greeter/rust --adapters {{.ADAPTERS}}'
      - diff -r target/examples-greeter/rust examples/greeter/out/rust
      - 'test "$(cat target/examples-greeter/rust/refusals.json)" = "[]"'
      - RUSTFLAGS='-D warnings' cargo build --manifest-path target/examples-greeter/rust/Cargo.toml --target-dir target/examples-greeter/build

  examples-series:
    desc: Read the algorithmic series package twice, pass it, write it as Go and as Rust, require every document and output equal to the checked-in copy, no refusal, gofmt-clean vetted Go and a Rust build without warnings, then run the original, the Go output and the Rust output on 200 seeded traces of 300 commands byte-equal.
    deps: [build]
    cmds:
      - rm -rf target/examples-series
      - mkdir -p target/examples-series
      - '{{.CODESPEC}} read --lang go examples/series/source --out target/examples-series/read.1.json --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} read --lang go examples/series/source --out target/examples-series/read.2.json --adapters {{.ADAPTERS}}'
      - cmp target/examples-series/read.1.json target/examples-series/read.2.json
      - cmp target/examples-series/read.1.json examples/series/series.read.cir.json
      - '{{.CODESPEC}} validate --canonical examples/series/series.read.cir.json'
      - '! grep -q ''"refusals"'' examples/series/series.read.cir.json'
      - '{{.CODESPEC}} pass examples/series/series.read.cir.json --out target/examples-series/pass.1.json'
      - '{{.CODESPEC}} pass target/examples-series/pass.1.json --out target/examples-series/pass.2.json'
      - cmp target/examples-series/pass.1.json examples/series/series.cir.json
      - cmp target/examples-series/pass.1.json target/examples-series/pass.2.json
      - '{{.CODESPEC}} write --lang go examples/series/series.read.cir.json --out target/examples-series/go --adapters {{.ADAPTERS}}'
      - diff -r target/examples-series/go examples/series/out/go
      - test -z "$(gofmt -l target/examples-series/go)"
      - go vet ./target/examples-series/go/series.go
      - '{{.CODESPEC}} write --lang go examples/series/series.cir.json --out target/examples-series/go-pass --adapters {{.ADAPTERS}}'
      - diff -r target/examples-series/go-pass examples/series/out/go
      - '{{.CODESPEC}} write --lang rust examples/series/series.cir.json --out target/examples-series/rust --adapters {{.ADAPTERS}}'
      - diff -r target/examples-series/rust examples/series/out/rust
      - 'test "$(cat target/examples-series/rust/refusals.json)" = "[]"'
      - RUSTFLAGS='-D warnings' cargo build --manifest-path target/examples-series/rust/Cargo.toml --target-dir target/examples-series/build
      - test -z "$(gofmt -l examples/series/drivers/go)"
      - cargo fmt --manifest-path examples/series/drivers/rust/Cargo.toml --check
      - cargo clippy --manifest-path examples/series/drivers/rust/Cargo.toml --locked --target-dir target/harness-series/rust-target -- -D warnings
      - '{{.CODESPEC}} harness examples/series --seeds 200 --commands 300 --build-dir target/harness-series'

  examples-inventory:
    desc: Read the hand-written Rust inventory crate twice, pass it, write it as Go and as Rust, require every document and output equal to the checked-in copy, no refusal, all three crates and the Go output building cleanly, then run the original, the Go output and the Rust output on 200 seeded traces of 300 commands byte-equal.
    deps: [build]
    cmds:
      - rm -rf target/examples-inventory
      - mkdir -p target/examples-inventory
      - '{{.CODESPEC}} read --lang rust examples/inventory/source --out target/examples-inventory/read.1.json --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} read --lang rust examples/inventory/source --out target/examples-inventory/read.2.json --adapters {{.ADAPTERS}}'
      - cmp target/examples-inventory/read.1.json target/examples-inventory/read.2.json
      - cmp target/examples-inventory/read.1.json examples/inventory/inventory.read.cir.json
      - '{{.CODESPEC}} validate --canonical examples/inventory/inventory.read.cir.json'
      - '! grep -q ''"refusals"'' examples/inventory/inventory.read.cir.json'
      - '{{.CODESPEC}} pass examples/inventory/inventory.read.cir.json --out target/examples-inventory/pass.1.json'
      - '{{.CODESPEC}} pass target/examples-inventory/pass.1.json --out target/examples-inventory/pass.2.json'
      - cmp target/examples-inventory/pass.1.json examples/inventory/inventory.cir.json
      - cmp target/examples-inventory/pass.1.json target/examples-inventory/pass.2.json
      - '{{.CODESPEC}} write --lang go examples/inventory/inventory.cir.json --out target/examples-inventory/go --adapters {{.ADAPTERS}}'
      - diff -r target/examples-inventory/go examples/inventory/out/go
      - test -z "$(gofmt -l target/examples-inventory/go)"
      - go vet ./target/examples-inventory/go/inventory.go
      - '{{.CODESPEC}} write --lang rust examples/inventory/inventory.cir.json --out target/examples-inventory/rust --adapters {{.ADAPTERS}}'
      - diff -r target/examples-inventory/rust examples/inventory/out/rust
      - 'test "$(cat target/examples-inventory/rust/refusals.json)" = "[]"'
      - RUSTFLAGS='-D warnings' cargo build --manifest-path target/examples-inventory/rust/Cargo.toml --target-dir target/examples-inventory/build
      - RUSTFLAGS='-D warnings' cargo build --manifest-path examples/inventory/source/Cargo.toml --target-dir target/examples-inventory/build-source
      - test -z "$(gofmt -l examples/inventory/drivers/go)"
      - cargo fmt --manifest-path examples/inventory/drivers/rust/Cargo.toml --check
      - cargo fmt --manifest-path examples/inventory/source/Cargo.toml --check
      - cargo clippy --manifest-path examples/inventory/drivers/rust/Cargo.toml --locked --target-dir target/harness-inventory/rust-target -- -D warnings
      - cargo clippy --manifest-path examples/inventory/drivers/rust-original/Cargo.toml --locked --target-dir target/harness-inventory/rust-original-target -- -D warnings
      - '{{.CODESPEC}} harness examples/inventory --seeds 200 --commands 300 --build-dir target/harness-inventory'
