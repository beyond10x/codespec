name: Release build

on:
  push:
    tags: ['0.*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            odin-flags: -extra-linker-flags:-static
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain rust-toolchain.toml names
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"

      - name: Install musl-gcc, the C compiler the cc crate takes for mimalloc on musl
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.4"

      - name: Install BEAM toolchains for the language adapters
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.0.6"
          elixir-version: "1.20.4"
          gleam-version: "1.19.0"

      - name: Install the Odin compiler
        uses: laytan/setup-odin@447aa179880a3f4e94011007c65cb9efdb6dd6a0 # v2.11.0
        env:
          LLVM_CONFIG: ${{ runner.os == 'macOS' && '/opt/homebrew/opt/llvm@20/bin/llvm-config' || '' }}
        with:
          release: ${{ runner.os == 'macOS' && 'false' || 'dev-2026-09' }}
          branch: dev-2026-09
          llvm-version: '20'
          build-type: release
          token: ${{ github.token }}

      - name: Build the Rust binaries
        env:
          TARGET: ${{ matrix.target }}
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME=/build-home --remap-path-prefix=$GITHUB_WORKSPACE=/codespec"
          cargo build --release --locked --target "$TARGET" -p b10x-codespec-cli -p codespec-write-rust -p codespec-read-rust -p codespec-run-rust -p codespec-write-c -p codespec-run-c -p b10x-codespec-eval -p codespec-odin

      - name: Build the Go adapters, static (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p target/release-go
          cd adapters/go
          go build -trimpath -ldflags=-buildid= -o ../../target/release-go/ ./cmd/codespec-read-go ./cmd/codespec-write-go ./cmd/codespec-run-go

      - name: Smoke-test the binaries
        env:
          TARGET: ${{ matrix.target }}
          ODIN_FLAGS: ${{ matrix.odin-flags }}
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          work="$RUNNER_TEMP/smoke"
          rel="target/$TARGET/release"
          mkdir -p "$bin" "$work"
          cp "$rel/codespec" "$rel/codespec-write-rust" "$rel/codespec-read-rust" "$rel/codespec-run-rust" "$rel/codespec-write-c" "$rel/codespec-run-c" "$rel/codespec-write-cir" "$rel/codespec-run-cir" target/release-go/codespec-read-go target/release-go/codespec-write-go target/release-go/codespec-run-go "$bin/"
          cp "$rel/codespec-write-odin" "$rel/codespec-run-odin" "$bin/"
          sh adapters/elixir/build.sh "$bin" "$GITHUB_REF_NAME"
          odin build adapters/odin/read "-out:$bin/codespec-read-odin" "-define:CODESPEC_VERSION=$GITHUB_REF_NAME" ${ODIN_FLAGS:+"$ODIN_FLAGS"}
          test "$("$bin/codespec" --version)" = "codespec $GITHUB_REF_NAME"
          test "$("$bin/codespec-read-go" --version)" = "codespec-read-go $GITHUB_REF_NAME built with $(go env GOVERSION)"
          "$bin/codespec" read --lang go examples/orders/source --out "$work/orders.read.cir.json" --adapters "$bin"
          cmp "$work/orders.read.cir.json" examples/orders/orders.read.cir.json
          "$bin/codespec" pass "$work/orders.read.cir.json" --out "$work/orders.cir.json"
          cmp "$work/orders.cir.json" examples/orders/orders.cir.json
          "$bin/codespec" write --lang go "$work/orders.cir.json" --out "$work/go" --adapters "$bin"
          "$bin/codespec" write --lang rust "$work/orders.cir.json" --out "$work/rust" --adapters "$bin"
          cmp "$work/rust/src/lib.rs" examples/orders/out/rust/src/lib.rs
          "$bin/codespec" read --lang rust examples/inventory/source --out "$work/inventory.read.cir.json" --adapters "$bin"
          cmp "$work/inventory.read.cir.json" examples/inventory/inventory.read.cir.json
          for lang in elixir gleam odin; do
            "$bin/codespec" read --lang "$lang" "conformance/cases/op-add/$lang" --out "$work/$lang.read.json" --adapters "$bin"
            jq -e '(.refusals // [] | length) == 0' "$work/$lang.read.json"
          done
          for lang in go rust c cir elixir gleam odin; do
            "$bin/codespec" write --lang "$lang" conformance/cases/op-add/case.cir.json --out "$work/op-add-$lang" --adapters "$bin"
            "$bin/codespec-run-$lang" --build "$work/op-add-$lang-build" "$work/op-add-$lang" conformance/cases/op-add/calls.json > "$work/op-add-$lang.txt"
            cmp "$work/op-add-$lang.txt" conformance/cases/op-add/expected.txt
          done

      - name: Package the binaries
        env:
          TARGET: ${{ matrix.target }}
        run: |
          package="codespec-$GITHUB_REF_NAME-$TARGET"
          mkdir -p "dist/$package"
          cp -R "$RUNNER_TEMP/bin/." "dist/$package/"
          cp README.md LICENSE "dist/$package/"
          mkdir -p "dist/$package/share/codespec/summaries"
          cp summaries/*.json "dist/$package/share/codespec/summaries/"
          tar -czf "dist/$package.tar.gz" -C "dist/$package" codespec codespec-read-go codespec-write-go codespec-run-go \
            codespec-read-rust codespec-write-rust codespec-run-rust codespec-write-c codespec-run-c \
            codespec-write-cir codespec-run-cir codespec-read-elixir codespec-write-elixir codespec-run-elixir \
            codespec-read-gleam codespec-write-gleam codespec-run-gleam codespec-read-odin codespec-write-odin codespec-run-odin \
            beam share README.md LICENSE
          sh scripts/release-summaries-check.sh "dist/$package.tar.gz"

      - name: Every binary of the musl archive is static and runs in a plain alpine container
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          TARGET: ${{ matrix.target }}
        run: sh scripts/release-static-check.sh archive "dist/codespec-$GITHUB_REF_NAME-$TARGET.tar.gz" "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codespec-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  kit:
    name: Conformance kit
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain rust-toolchain.toml names
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.4"

      - name: Install go-task, an authenticated download (scripts/ci-tools.sh)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sh scripts/ci-tools.sh fetch "$RUNNER_TEMP/ci-tools" task
          sh scripts/ci-tools.sh install "$RUNNER_TEMP/ci-tools" task

      - name: Pack the kit and run codespec conform on the unpacked copy
        run: |
          set -euo pipefail
          task conformance-kit
          test -f "target/conformance-kit/codespec-conformance-$GITHUB_REF_NAME.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codespec-${{ github.ref_name }}-conformance
          path: target/conformance-kit/codespec-conformance-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  checksums:
    name: SHA256SUMS
    needs: [build, kit]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: codespec-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        run: |
          cd dist
          archives=(*.tar.gz)
          test "${#archives[@]}" -eq 5
          test -f "codespec-conformance-$GITHUB_REF_NAME.tar.gz"
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codespec-${{ github.ref_name }}-release
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
