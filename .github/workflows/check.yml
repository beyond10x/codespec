name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  plan:
    name: check / parts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: The parts of task check, from scripts/check-parts.txt
        id: parts
        run: |
          set -euo pipefail
          parts=$(sh scripts/check-part.sh matrix)
          echo "$parts" | jq .
          echo "parts=$parts" >> "$GITHUB_OUTPUT"

      - name: The planning-only path list's own cases
        run: sh scripts/planning-only.sh test

      - name: Whether this pull request changes code, from scripts/planning-only.sh
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          code=true
          if [ "$EVENT" = pull_request ] && git rev-parse --quiet --verify 'HEAD^2' > /dev/null; then
            git diff --name-only 'HEAD^1' HEAD > "$RUNNER_TEMP/changed.txt"
            cat "$RUNNER_TEMP/changed.txt"
            if sh scripts/planning-only.sh < "$RUNNER_TEMP/changed.txt"; then code=false; fi
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  tools:
    name: check / tools
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-tools
          key: ci-tools-${{ hashFiles('scripts/ci-tools.sh') }}

      - name: Fetch go-task and Groovy once for the run, unless cached
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/ci-tools.sh fetch "$RUNNER_TEMP/ci-tools" task groovy

  part:
    name: check / ${{ matrix.part }}
    needs: [plan, tools]
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain rust-toolchain.toml names
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.part }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: adapters/go/go.mod

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        id: jdk
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: adapters/java/testdata/*/pom.xml

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-tools
          key: ci-tools-${{ hashFiles('scripts/ci-tools.sh') }}

      - name: Install go-task and Groovy 2.4.10 from the run's cache, fetching only on a miss
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sh scripts/ci-tools.sh fetch "$RUNNER_TEMP/ci-tools" task groovy
          sh scripts/ci-tools.sh install "$RUNNER_TEMP/ci-tools" task groovy

      - name: Install BEAM toolchains for the language adapters
        if: startsWith(matrix.part, 'task ')
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.0.6"
          elixir-version: "1.20.4"
          gleam-version: "1.19.0"

      - name: Install the Odin compiler
        if: startsWith(matrix.part, 'task ')
        uses: laytan/setup-odin@447aa179880a3f4e94011007c65cb9efdb6dd6a0 # v2.11.0
        with:
          release: dev-2026-09
          token: ${{ github.token }}

      - name: ${{ matrix.part }}
        env:
          JDK: ${{ steps.jdk.outputs.path }}
          PART: ${{ matrix.part }}
          MVN_FLAGS: -B -q
          CHECK_PART_LIMITS: "1"
          RUST_TEST_THREADS: "1"
        run: sh scripts/check-part.sh run "$PART"

  check:
    name: codespec / task check
    if: always()
    needs: [plan, tools, part]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part of task check passed, or the pull request is planning-only
        env:
          PLAN: ${{ needs.plan.result }}
          CODE: ${{ needs.plan.outputs.code }}
          TOOLS: ${{ needs.tools.result }}
          RESULT: ${{ needs.part.result }}
        run: |
          set -euo pipefail
          echo "plan=$PLAN code=$CODE tools=$TOOLS part=$RESULT"
          test "$PLAN" = success
          if [ "$CODE" = false ]; then
            echo "planning-only pull request: no build or test ran"
            test "$TOOLS" = skipped
            test "$RESULT" = skipped
            exit 0
          fi
          test "$CODE" = true
          test "$TOOLS" = success
          test "$RESULT" = success
