name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  plan:
    name: check / parts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: The parts of task check, from scripts/check-parts.txt
        id: parts
        run: |
          set -euo pipefail
          parts=$(sh scripts/check-part.sh matrix)
          echo "$parts" | jq .
          echo "parts=$parts" >> "$GITHUB_OUTPUT"

  part:
    name: check / ${{ matrix.part }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain rust-toolchain.toml names
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.part }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: adapters/go/go.mod

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        id: jdk
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: adapters/java/testdata/*/pom.xml

      - name: Install go-task
        env:
          TASK_VERSION: "3.52.0"
          TASK_SHA256: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 15 --retry-all-errors --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Install Groovy 2.4.10
        env:
          GROOVY_VERSION: "2.4.10"
          GROOVY_SHA256: 1c4dff3b6edf9a8ced3bca658ee1857cee90cfed1ee3474a2790045033c317a9
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 15 --retry-all-errors --output "$RUNNER_TEMP/groovy.zip" \
            "https://repo1.maven.org/maven2/org/codehaus/groovy/groovy-binary/$GROOVY_VERSION/groovy-binary-$GROOVY_VERSION.zip"
          echo "$GROOVY_SHA256  $RUNNER_TEMP/groovy.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/groovy.zip" -d "$RUNNER_TEMP"
          echo "GROOVY_HOME=$RUNNER_TEMP/groovy-$GROOVY_VERSION" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/groovy-$GROOVY_VERSION/bin" >> "$GITHUB_PATH"

      - name: ${{ matrix.part }}
        env:
          JDK: ${{ steps.jdk.outputs.path }}
          PART: ${{ matrix.part }}
          MVN_FLAGS: -B -q
          CHECK_PART_LIMITS: "1"
          RUST_TEST_THREADS: "1"
        run: sh scripts/check-part.sh run "$PART"

  check:
    name: codespec / task check
    if: always()
    needs: [plan, part]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part of task check passed
        env:
          PLAN: ${{ needs.plan.result }}
          RESULT: ${{ needs.part.result }}
        run: test "$PLAN" = success && test "$RESULT" = success
