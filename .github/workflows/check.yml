name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  part:
    name: check / ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part:
          - lint
          - test b10x-codespec-model b10x-codespec-passes b10x-codespec-harness
          - test b10x-codespec-cli
          - test b10x-codespec-check
          - test b10x-codespec-conformance --lib --bins
          - test b10x-codespec-conformance --test=adversary2
          - test b10x-codespec-conformance --test=adversary_conform
          - test b10x-codespec-conformance --test=cases
          - test b10x-codespec-conformance --test=conform
          - test codespec-docs
          - test codespec-write-rust
          - test codespec-read-rust codespec-run-rust
          - test codespec-write-c codespec-run-c
          - test codespec-read-c
          - adapters
          - examples
          - conformance
          - docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain rust-toolchain.toml names
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.part }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: adapters/go/go.mod

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        id: jdk
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: adapters/java/testdata/*/pom.xml

      - name: Install go-task
        env:
          TASK_VERSION: "3.52.0"
          TASK_SHA256: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Install Groovy 2.4.10
        env:
          GROOVY_VERSION: "2.4.10"
          GROOVY_SHA256: 1c4dff3b6edf9a8ced3bca658ee1857cee90cfed1ee3474a2790045033c317a9
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/groovy.zip" \
            "https://repo1.maven.org/maven2/org/codehaus/groovy/groovy-binary/$GROOVY_VERSION/groovy-binary-$GROOVY_VERSION.zip"
          echo "$GROOVY_SHA256  $RUNNER_TEMP/groovy.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/groovy.zip" -d "$RUNNER_TEMP"
          echo "GROOVY_HOME=$RUNNER_TEMP/groovy-$GROOVY_VERSION" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/groovy-$GROOVY_VERSION/bin" >> "$GITHUB_PATH"

      - name: ${{ matrix.part }}
        env:
          JDK: ${{ steps.jdk.outputs.path }}
          PART: ${{ matrix.part }}
          MVN_FLAGS: -B -q
        run: |
          set -euo pipefail
          case "$PART" in
            lint)
              cargo fmt --all --check
              cargo clippy --workspace --all-targets --locked -- -D warnings ;;
            test\ *)
              args=()
              # A word starting with -- is a cargo target selector (--lib, --test=<name>); any
              # other word is a package.
              for p in ${PART#test }; do
                case "$p" in --*) args+=("$p") ;; *) args+=(-p "$p") ;; esac
              done
              cargo test --locked "${args[@]}" --no-run
              ( while sleep 30; do echo "== ps $(date +%T)"; ps -eo rss,nlwp,etimes,args --sort=-rss --no-headers | head -5 | cut -c1-160; echo "procs $(ps -e --no-headers | wc -l)"; done ) &
              ulimit -u 2048
              ulimit -v 8388608
              case "$PART" in
                *--test=*)
                  # One test at a time, each killed after three minutes; its output goes to a
                  # file so a child it leaves behind cannot hold this step open, and a test that
                  # does not finish is named with the processes still running.
                  cargo test --locked "${args[@]}" --no-run --message-format=json \
                    | jq -r 'select(.profile.test == true) | .executable // empty' > "$RUNNER_TEMP/bins"
                  failed=0
                  while read -r bin; do
                    for t in $("$bin" --list --format terse | sed -n 's/: test$//p'); do
                      s=$(date +%s); rc=0
                      timeout -s KILL 180 setsid "$bin" --exact "$t" --test-threads 1 \
                        > "$RUNNER_TEMP/test.out" 2>&1 < /dev/null || rc=$?
                      echo "::group::$t rc=$rc $(( $(date +%s) - s ))s"
                      tail -c 100000 "$RUNNER_TEMP/test.out"
                      echo "::endgroup::"
                      if [ "$rc" -ne 0 ]; then
                        failed=1
                        echo "::error::$t exited $rc after $(( $(date +%s) - s ))s"
                        ps -eo pid,pgid,etimes,rss,args --forest | cut -c1-200
                      fi
                    done
                  done < "$RUNNER_TEMP/bins"
                  exit "$failed" ;;
                *)
                  timeout -k 10 600 cargo test --locked "${args[@]}" -- --test-threads 1 ;;
              esac ;;
            adapters)
              task adapters-check JDK="$JDK" MVN_FLAGS="$MVN_FLAGS"
              task groovy-fixture-check JDK="$JDK" ;;
            examples)
              for t in examples-check examples-pass examples-go examples-rust examples-greeter examples-inventory examples-series examples-ledger examples-fees harness; do
                echo "::group::task $t"
                task "$t" JDK="$JDK"
                echo "::endgroup::"
              done ;;
            conformance)
              task conformance-cases JDK="$JDK"
              task conformance-kit JDK="$JDK" ;;
            docs)
              task docs-check JDK="$JDK" ;;
          esac

  check:
    name: codespec / task check
    if: always()
    needs: part
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part of task check passed
        env:
          RESULT: ${{ needs.part.result }}
        run: test "$RESULT" = success
