name: conform shards

# Temporary: the tests of crates/conformance/tests/conform.rs pass one per runner and stop the
# runner when run in sequence in the check job. These two jobs run them in sequence, one plain and
# one with the check job's limits and Groovy, to tell an environment cause from an accumulating one.
# Removed once the cause is found.

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  shard:
    name: conform / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        mode: [all, first-half, second-half]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain rust-toolchain.toml names
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: conform-shard

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: adapters/go/go.mod

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the conform tests
        run: |
          set -euo pipefail
          cargo test --locked -p b10x-codespec-conformance --test conform --no-run --message-format=json \
            | jq -r 'select(.profile.test == true) | .executable // empty' > "$RUNNER_TEMP/bin"

      - name: conform in sequence, ${{ matrix.mode }}
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          bin=$(cat "$RUNNER_TEMP/bin")
          "$bin" --list --format terse | sed -n 's/: test$//p' > "$RUNNER_TEMP/all"
          n=$(wc -l < "$RUNNER_TEMP/all"); h=$(( (n + 1) / 2 ))
          case "$MODE" in
            all) cp "$RUNNER_TEMP/all" "$RUNNER_TEMP/these" ;;
            first-half) head -n "$h" "$RUNNER_TEMP/all" > "$RUNNER_TEMP/these" ;;
            second-half) tail -n +"$(( h + 1 ))" "$RUNNER_TEMP/all" > "$RUNNER_TEMP/these" ;;
          esac
          cat "$RUNNER_TEMP/these"
          ( while sleep 10; do echo "== ps $(date +%T)"; ps -eo rss,nlwp,etimes,args --sort=-rss --no-headers | head -5 | cut -c1-160; free -m | sed -n 2p; echo "procs $(ps -e --no-headers | wc -l)"; done ) &
          while read -r t; do
            echo "== start $t $(date +%T)"
            timeout -s KILL 120 "$bin" --exact "$t" --test-threads 1
          done < "$RUNNER_TEMP/these"
