name: conform shards

# Temporary: the tests of crates/conformance/tests/conform.rs pass one per runner and stop the
# runner when run in sequence in the check job. These two jobs run them in sequence, one plain and
# one with the check job's limits and Groovy, to tell an environment cause from an accumulating one.
# Removed once the cause is found.

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  shard:
    name: conform / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, limits-and-groovy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain rust-toolchain.toml names
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: conform-shard

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: adapters/go/go.mod

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Groovy 2.4.10
        if: matrix.mode == 'limits-and-groovy'
        env:
          GROOVY_VERSION: "2.4.10"
          GROOVY_SHA256: 1c4dff3b6edf9a8ced3bca658ee1857cee90cfed1ee3474a2790045033c317a9
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/groovy.zip" \
            "https://repo1.maven.org/maven2/org/codehaus/groovy/groovy-binary/$GROOVY_VERSION/groovy-binary-$GROOVY_VERSION.zip"
          echo "$GROOVY_SHA256  $RUNNER_TEMP/groovy.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/groovy.zip" -d "$RUNNER_TEMP"
          echo "GROOVY_HOME=$RUNNER_TEMP/groovy-$GROOVY_VERSION" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/groovy-$GROOVY_VERSION/bin" >> "$GITHUB_PATH"

      - name: Build the conform tests
        run: cargo test --locked -p b10x-codespec-conformance --test conform --no-run

      - name: conform in sequence, ${{ matrix.mode }}
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          ( while sleep 10; do echo "== ps $(date +%T)"; ps -eo rss,nlwp,etimes,args --sort=-rss --no-headers | head -5 | cut -c1-160; free -m | sed -n 2p; echo "procs $(ps -e --no-headers | wc -l)"; done ) &
          if [ "$MODE" = limits-and-groovy ]; then
            ulimit -u 2048
            ulimit -v 8388608
          fi
          timeout -s KILL 420 cargo test --locked -p b10x-codespec-conformance --test conform -- --test-threads 1 --nocapture
