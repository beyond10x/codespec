name: Documentation validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Build the Docusaurus site
        run: npm --prefix website ci && npm --prefix website run build
      - name: Bind the built site to its source commit
        run: |
          cargo test --locked -p codespec-docs
          cargo run --locked -p codespec-docs -- provenance --site website/build --commit "$GITHUB_SHA"
      - name: Upload the exact built site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b10x-project-site
          path: website/build
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  ux:
    name: UX gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            ux/package-lock.json
      - name: Build the Docusaurus site
        run: npm --prefix website ci && npm --prefix website run build
      - name: Install the UX harness and Chromium
        working-directory: ux
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Fetch the baseline on main for the ratchet
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - name: UX gate
        working-directory: ux
        timeout-minutes: 4
        run: |
          npx tsc --noEmit
          node cli.ts findings
          npx playwright test --workers=4
          node cli.ts ratchet
