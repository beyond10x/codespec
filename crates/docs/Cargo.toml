[package]
name = "codespec-docs"
description = "Generates the derived pages of the codespec documentation site (CLI, crates, cir/1, status) and checks them for drift"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "codespec-docs"
path = "src/main.rs"

[dependencies]
b10x-codespec-cli = { path = "../cli" }
b10x-codespec-model = { path = "../model" }
b10x-codespec-conformance = { path = "../conformance" }
b10x-codespec-effects = { path = "../effects" }
b10x-codespec-eval = { path = "../eval" }
clap.workspace = true
serde_json.workspace = true
