[package]
name = "b10x-codespec-cli"
description = "The codespec command: validate cir/1, print its schema, apply the passes, run reader and writer adapters and the comparison harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "codespec_cli"
path = "src/lib.rs"

[[bin]]
name = "codespec"
path = "src/main.rs"

[dependencies]
b10x-codespec-model = { path = "../model" }
b10x-codespec-harness = { path = "../harness" }
b10x-codespec-passes = { path = "../passes" }
b10x-codespec-conformance = { path = "../conformance" }
b10x-codespec-effects = { path = "../effects" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
