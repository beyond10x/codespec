trace = "inventory"

[[implementation]]
name = "original"
build = ["cargo", "build", "--locked", "--quiet", "--manifest-path", "drivers/rust-original/Cargo.toml", "--target-dir", "{build}/rust-original-target"]
run = ["{build}/rust-original-target/debug/inventory-driver-original"]

[[implementation]]
name = "go"
build = ["go", "build", "-C", "drivers/go", "-overlay", "overlay-go.json", "-o", "{build}/go", "."]
run = ["{build}/go"]

[[implementation]]
name = "rust"
build = ["cargo", "build", "--locked", "--quiet", "--manifest-path", "drivers/rust/Cargo.toml", "--target-dir", "{build}/rust-target"]
run = ["{build}/rust-target/debug/inventory-driver"]
