[workspace]
resolver = "3"
members = ["crates/model", "crates/passes", "crates/cli", "adapters/rust"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/codespec"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
prettyplease = "0.3"
proc-macro2 = { version = "1.0", default-features = false }
quote = { version = "1.0", default-features = false }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "3", default-features = false, features = ["full", "parsing", "printing"] }
